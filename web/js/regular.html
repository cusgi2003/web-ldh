<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 정규표현식 : 문자열이 특정 규칙에 맞는지 검사하거나, 원하는 문자를 찾고 
        // 바꾸기 위한 표현식이다

        // 기본형태
        // /패턴/
        let regex = /abc/; //문자열 안에 abc가 있는지 검사하는 패턴

        // test()메서드
        // 문자열이 정규식에 맞는지 검사하는 메서드
        // 정규식.test(문자열)
        console.log(regex.test("abc"));
        console.log(regex.test("abcd"));
        console.log(regex.test("ab"));
        console.log(regex.test("hello abc"));

        // 숫자만 입력했는지 검색하는 정규식
        regex.test()

        // 영문 소문자와 숫자만 허용
        // 5자 이상 12자 이하
        regex.test("a-z{5,12}")

        // 자주 쓰는 정규식 기호
        // ^ : 문자열 시작 /^a/
        // $ : 문자열 끝 /a$/
        // . : 아무 문자 1개 /a.c/ abc, axc, ayc
        // [] : 문자 범위 /[abc]/ -> a,b,c 중 1글자
        // [^] : 제외
        //  + : 1개 이상
        //  * : 0개 이상
        //  ? : 0 또는 1개
        // {n} : 정확히 n개
        // {n,m} : n개 이상 m개 이하
        // 0~9 : 0 ~ 9 사이
        // a-z : a ~ z 사이
        // A-Z : A ~ Z 사이

    </script>
</body>
</html>
